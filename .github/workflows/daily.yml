name: daily-nifty-plan

on:
  schedule:
    - cron: "30 11 * * 1-5"      # 11:30 UTC = 5:00 PM IST, Monday-Friday
  workflow_dispatch:              # lets you press "Run workflow" manually

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install yfinance pandas numpy scikit-learn

      - name: Build today's plan
        run: python daily_plan.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Backtest (only when you run it manually)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python nifty50_hedged_bot.py backtest 2>&1 | tee docs/backtest.txt

      - name: Save results to the repo
        run: |
          git config user.name "nifty-bot"
          git config user.email "nifty-bot@users.noreply.github.com"
          git add docs
          git commit -m "Plan $(date -u +%F)" || echo "Nothing to commit"
          git push
